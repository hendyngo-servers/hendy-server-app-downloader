name: Deploy Hendy Portal, Admin and Shared API to Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - both
          - pages
          - workers
        default: both

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and validate
        run: |
          npm install
          npm run lint
          npm run test:api
          npm run build
          node scripts/verify-frontend-separation.mjs
      - name: Validate backend origin
        env:
          RENDER_BACKEND_ORIGIN: ${{ secrets.RENDER_BACKEND_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.RENDER_BACKEND_ORIGIN?.trim();
          if (!raw) throw new Error("Add repository secret RENDER_BACKEND_ORIGIN first.");
          const url = new URL(raw);
          if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash || url.username || url.password) {
            throw new Error("RENDER_BACKEND_ORIGIN must be an HTTPS origin without path, query, fragment or credentials.");
          }
          NODE
      - name: Prepare Pages bindings
        if: inputs.target == 'both' || inputs.target == 'pages'
        env:
          RENDER_BACKEND_ORIGIN: ${{ secrets.RENDER_BACKEND_ORIGIN }}
          SHARED_API_DOMAIN: ${{ secrets.SHARED_API_DOMAIN }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const backend = new URL(process.env.RENDER_BACKEND_ORIGIN);
          const entries = ["BACKEND_ORIGIN=" + backend.origin];
          const shared = process.env.SHARED_API_DOMAIN?.trim();
          if (shared) entries.push("SHARED_API_DOMAIN=" + shared.toLowerCase().replace(/\.$/, ""));
          writeFileSync(".pages-bindings.env", entries.join("\n") + "\n", { mode: 0o600 });
          NODE
      - name: Set Pages Functions bindings
        if: inputs.target == 'both' || inputs.target == 'pages'
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages secret bulk .pages-bindings.env --project-name=hendy-server-app-downloader --config=wrangler.pages.toml
      - name: Deploy Cloudflare Pages
        if: inputs.target == 'both' || inputs.target == 'pages'
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hendy-server-app-downloader --branch=main --config=wrangler.pages.toml
      - name: Deploy Cloudflare Worker
        if: inputs.target == 'both' || inputs.target == 'workers'
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.toml
      - name: Configure Worker backend secret
        if: inputs.target == 'both' || inputs.target == 'workers'
        env:
          RENDER_BACKEND_ORIGIN: ${{ secrets.RENDER_BACKEND_ORIGIN }}
          SHARED_API_DOMAIN: ${{ secrets.SHARED_API_DOMAIN }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const backend = new URL(process.env.RENDER_BACKEND_ORIGIN);
          const entries = ["BACKEND_ORIGIN=" + backend.origin];
          const shared = process.env.SHARED_API_DOMAIN?.trim();
          if (shared) entries.push("SHARED_API_DOMAIN=" + shared.toLowerCase().replace(/\.$/, ""));
          writeFileSync(".worker-bindings.env", entries.join("\n") + "\n", { mode: 0o600 });
          NODE
          npx wrangler@4.152.0 secret bulk .worker-bindings.env --config=wrangler.toml
      - name: Clean temporary secret files
        if: always()
        run: rm -f .pages-bindings.env .worker-bindings.env
