name: Deploy Hendy Server App Store to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy to Cloudflare Workers, Pages, or both"
        required: true
        type: choice
        options:
          - workers
          - pages
          - both
        default: workers

permissions:
  contents: write

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_DISPLAY_NAME: ${{ vars.ADMIN_DISPLAY_NAME }}
      ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
      PUBLIC_DOWNLOAD_DOMAIN: ${{ vars.PUBLIC_DOWNLOAD_DOMAIN }}
      SHARED_API_DOMAIN: ${{ vars.SHARED_API_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ADMIN_USERNAME" || { echo "Missing GitHub secret ADMIN_USERNAME"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing GitHub secret ADMIN_PASSWORD"; exit 1; }
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: |
          npm run lint
          npm run build
          node scripts/verify-frontend-separation.mjs
      - name: Ensure Cloudflare D1 and R2 resources exist
        run: node scripts/ensure-cloudflare-resources.mjs
      - name: Apply Cloudflare D1 migrations
        run: npx --yes wrangler@4.152.0 d1 migrations apply hendy-server-app-store --remote --config=wrangler.toml --yes
      - name: Prepare runtime secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const values = {
            ADMIN_USERNAME: process.env.ADMIN_USERNAME,
            ADMIN_PASSWORD: process.env.ADMIN_PASSWORD,
            ADMIN_DISPLAY_NAME: process.env.ADMIN_DISPLAY_NAME || "Hendy Administrator"
          };
          for (const key of ["ADMIN_DOMAIN", "PUBLIC_DOWNLOAD_DOMAIN", "SHARED_API_DOMAIN"]) {
            const value = process.env[key]?.trim();
            if (value) values[key] = value.toLowerCase().replace(/\.$/, "");
          }
          writeFileSync(".cloudflare-runtime-secrets.json", JSON.stringify(values), { mode: 0o600 });
          NODE
      - name: Set Worker runtime secrets
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'workers' || inputs.target == 'both')) || (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (vars.CLOUDFLARE_TARGET == '' || vars.CLOUDFLARE_TARGET == 'workers' || vars.CLOUDFLARE_TARGET == 'both')) }}
        run: npx --yes wrangler@4.152.0 secret bulk .cloudflare-runtime-secrets.json --config=wrangler.toml
      - name: Deploy full-stack Cloudflare Worker
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'workers' || inputs.target == 'both')) || (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (vars.CLOUDFLARE_TARGET == '' || vars.CLOUDFLARE_TARGET == 'workers' || vars.CLOUDFLARE_TARGET == 'both')) }}
        run: npx --yes wrangler@4.152.0 deploy --config=wrangler.toml
      - name: Set Pages Functions runtime secrets
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'pages' || inputs.target == 'both')) || (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (vars.CLOUDFLARE_TARGET == 'pages' || vars.CLOUDFLARE_TARGET == 'both')) }}
        run: npx --yes wrangler@4.152.0 pages secret bulk .cloudflare-runtime-secrets.json --project-name=hendy-server-app-downloader --config=wrangler.pages.toml
      - name: Deploy Cloudflare Pages and Functions
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'pages' || inputs.target == 'both')) || (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (vars.CLOUDFLARE_TARGET == 'pages' || vars.CLOUDFLARE_TARGET == 'both')) }}
        run: npx --yes wrangler@4.152.0 pages deploy dist --project-name=hendy-server-app-downloader --branch=main --config=wrangler.pages.toml
      - name: Persist generated non-secret D1 ID in repository
        if: always() && github.event_name == 'workflow_dispatch' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml wrangler.pages.toml
          if ! git diff --cached --quiet; then
            git commit -m "Configure Cloudflare D1 database binding"
            git push origin HEAD:main
          else
            echo "Cloudflare resource IDs are already up to date."
          fi
      - name: Remove temporary secret file
        if: always()
        run: rm -f .cloudflare-runtime-secrets.json
