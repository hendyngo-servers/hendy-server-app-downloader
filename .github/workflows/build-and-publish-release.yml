name: Build and publish Hendy App Store release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      release_name:
        description: "Human-readable release name"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hendy-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and validate source
        run: |
          npm install
          npm run lint
          npm run test:api
          npm run build
          node scripts/verify-frontend-separation.mjs
      - name: Package source and web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          git archive --format=zip --output=release-output/hendy-server-app-store-source.zip HEAD
          cd dist
          zip -qr ../release-output/hendy-server-app-store-web-build.zip .
          cd ..
          (cd release-output && sha256sum *.zip > SHA256SUMS.txt)
      - name: Collect optional Windows and Android packages
        shell: bash
        run: |
          set -euo pipefail
          # This repository does not contain native Windows/Android application projects.
          # Add real, signed packages to release-assets/windows/*.exe|*.msi and
          # release-assets/android/*.apk before running this workflow.
          shopt -s nullglob
          for file in release-assets/windows/*.exe release-assets/windows/*.msi release-assets/android/*.apk; do
            cp "$file" release-output/
          done
          if compgen -G 'release-output/*.exe' > /dev/null || compgen -G 'release-output/*.msi' > /dev/null || compgen -G 'release-output/*.apk' > /dev/null; then
            (cd release-output && sha256sum *.exe *.msi *.apk 2>/dev/null >> SHA256SUMS.txt || true)
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          args=(release create "$TAG" release-output/* --title "$RELEASE_NAME" --notes "Automated build of Hendy Server App Store. Source archive and web build are included. Windows installers/APKs are attached only when real packages were supplied under release-assets/. SHA-256 values are listed in SHA256SUMS.txt.")
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
