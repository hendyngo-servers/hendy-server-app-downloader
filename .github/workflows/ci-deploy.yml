name: Validate Hendy Server App Store for Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun (verify lockfile)
        uses: oven-sh/setup-bun@v2
      - name: Verify frozen Bun lockfile
        run: bun install --frozen-lockfile
      - name: Ensure frozen install does not edit lockfile
        run: git diff --exit-code -- bun.lock
      - name: Install npm dependencies
        run: npm install
      - name: Type-check TypeScript, including Worker and Pages Functions
        run: npm run lint
      - name: Build separate Portal and Admin entries
        run: npm run build
      - name: Verify separate frontend bundles
        run: node scripts/verify-frontend-separation.mjs
      - name: Test Cloudflare API with local D1 and R2
        run: npm run test:api
      - name: Validate Workers configuration
        run: npx --yes wrangler@4.152.0 deploy --dry-run --config=wrangler.toml
      - name: Validate Pages Functions configuration
        run: npx --yes wrangler@4.152.0 pages functions build --outdir=.wrangler/pages-functions --config=wrangler.pages.toml
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: hendy-cloudflare-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
