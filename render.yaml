services:
  - type: web
    name: hendy-server-app-downloader
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: PG_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: "Hendy Administrator"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "hendy-server-app-artifacts"
      - key: ADMIN_DOMAIN
        sync: false
      - key: PUBLIC_DOWNLOAD_DOMAIN
        sync: false
